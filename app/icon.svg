<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#g)"/>
  <!-- Invoice / receipt silhouette -->
  <g fill="#ffffff">
    <!-- Page -->
    <path d="M19 14 h22 a3 3 0 0 1 3 3 v30 l-5 -3 l-5 3 l-5 -3 l-5 3 v-30 a3 3 0 0 1 3 -3 z"/>
    <!-- Header bar -->
    <rect x="24" y="20" width="12" height="3" rx="1.5" opacity="0.95"/>
    <!-- Line items -->
    <rect x="24" y="28" width="16" height="2" rx="1" opacity="0.85"/>
    <rect x="24" y="33" width="16" height="2" rx="1" opacity="0.85"/>
    <rect x="24" y="38" width="11" height="2" rx="1" opacity="0.85"/>
    <!-- Total / accent bar (pink, slightly emphasised) -->
    <rect x="24" y="45" width="14" height="2.5" rx="1.25" fill="#fde68a"/>
  </g>
  <!-- Small green "paid" dot (top-right corner) -->
  <circle cx="50" cy="14" r="5" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
</svg>
